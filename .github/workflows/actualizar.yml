name: Actualizar TCO

on:
  schedule:
    # Desde la RD 142/2026 el BCB publica el TCO a las 23:30 de La Paz (03:30 UTC).
    # Se corre a las 04:15 UTC (00:15 de La Paz) y, por si el BCB se retrasa,
    # otra vez a las 13:00 UTC (09:00 de La Paz).
    # Las corridas son idempotentes: solo descargan fechas nuevas.
    - cron: "15 4 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-tco
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y consolidar
        run: python scripts/fetch_tco.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin datos nuevos."
          else
            git commit -m "datos: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
